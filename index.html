<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="The Drunken Eagle Golf League — standings, handicaps, schedule, player stats and league news.">
<title>The Drunken Eagle Golf League</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
<!-- ============ ICONS + LOGO ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d98f"/><stop offset="1" stop-color="#b8903a"/></linearGradient>
    <radialGradient id="g-ball" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfd3cc"/></radialGradient>
  </defs>
  <symbol id="crest" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="47" fill="#0d3524" stroke="url(#g-gold)" stroke-width="3.5"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#c9a24a" stroke-opacity=".35" stroke-width="1"/>
    <g transform="rotate(-9 50 56)">
      <g fill="url(#g-gold)">
        <path d="M39 51 Q 24 47 9 30 Q 27 40 40 45 Z"/>
        <path d="M39 58 Q 25 57 12 45 Q 28 52 40 53 Z"/>
        <path d="M39 64 Q 29 65 19 59 Q 30 61 40 60 Z"/>
      </g>
      <g fill="url(#g-gold)" transform="translate(100 0) scale(-1 1)">
        <path d="M39 51 Q 24 47 9 30 Q 27 40 40 45 Z"/>
        <path d="M39 58 Q 25 57 12 45 Q 28 52 40 53 Z"/>
        <path d="M39 64 Q 29 65 19 59 Q 30 61 40 60 Z"/>
      </g>
      <circle cx="50" cy="56" r="12.5" fill="url(#g-ball)"/>
      <g fill="#9aa39a" opacity=".55">
        <circle cx="46" cy="52" r="1.3"/><circle cx="51" cy="51" r="1.3"/><circle cx="55" cy="54" r="1.3"/>
        <circle cx="45" cy="57" r="1.3"/><circle cx="50" cy="56" r="1.3"/><circle cx="55" cy="59" r="1.3"/>
        <circle cx="48" cy="61" r="1.3"/><circle cx="53" cy="63" r="1.1"/><circle cx="44" cy="62" r="1.1"/>
      </g>
    </g>
    <path d="M50 14 l2.2 4.6 5 .7 -3.6 3.5 .9 5 -4.5-2.4 -4.5 2.4 .9-5 -3.6-3.5 5-.7z" fill="#e8cc7a"/>
    <path d="M30 80 Q50 88 70 80" stroke="#c9a24a" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M16 5h3v2a3 3 0 0 1-3 3M8 5H5v2a3 3 0 0 0 3 3"/><path d="M12 13v4M8 21h8M9 17h6v4H9z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V3l11 4-11 4"/><ellipse cx="9" cy="21" rx="5" ry="1.2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17a9 9 0 1 1 17 0"/><path d="m12 13 4-5"/><circle cx="12" cy="13" r="1.4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-golf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="10" cy="10" r=".6" fill="currentColor"/><circle cx="13" cy="9.5" r=".6" fill="currentColor"/><circle cx="14.5" cy="12.5" r=".6" fill="currentColor"/><circle cx="11" cy="13.5" r=".6" fill="currentColor"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 12 12" fill="currentColor"><path d="M6 2 11 9H1z"/></symbol>
  <symbol id="i-down" viewBox="0 0 12 12" fill="currentColor"><path d="M6 10 1 3h10z"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="#home" aria-label="The Drunken Eagle Golf League — home">
    <img class="logo" id="brand-logo" src="img/logo-mark.jpg" alt="">
    <span class="brand-txt"><b>Drunken Eagle</b><small>Golf League</small></span>
  </a>
  <nav class="topnav" id="topnav" aria-label="Main"></nav>
  <div class="top-actions">
    <a class="icon-btn" href="#admin" aria-label="Admin" title="Admin"><svg><use href="#i-lock"/></svg></a>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<nav class="bottomnav" id="bottomnav" aria-label="Quick navigation"></nav>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="More pages"><div class="grab"></div><div class="sheet-grid" id="sheet-grid"></div></div>

<script src="js/config.js"></script>
<script>
  /* League artwork (replace the files in /img, or upload new ones in Admin → Photos) */
  window.DEGL_ASSETS = window.DEGL_ASSETS || {
    hero: "img/hero.jpg", heroM: "img/hero-m.jpg",
    banner: "img/banner.jpg", bannerM: "img/banner-m.jpg",
    logo: "img/logo.jpg", mark: "img/logo-mark.jpg", bust: "img/logo-bust.jpg"
  };
</script>
<script>
  /* Load the Supabase client only when a database is configured. */
  if (window.DEGL_CONFIG && window.DEGL_CONFIG.SUPABASE_URL) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');
  }
</script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/teetimes.js"></script>
<script src="js/admin.js"></script>
<script src="js/demo.js"></script>
<script>App.start();</script>
</body>
</html>
